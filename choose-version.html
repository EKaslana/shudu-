<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>选择数独版本</title>
  <script>
    (function () {
      var segments = window.location.pathname.split("/").filter(Boolean);
      var baseHref = window.location.hostname.endsWith("github.io") && segments.length > 0
        ? "/" + segments[0] + "/"
        : "/";
      document.write('<base href="' + baseHref + '">');
    })();
  </script>
  <link rel="stylesheet" href="web/styles/entry.css">
  <link rel="stylesheet" href="web/styles/ink-theme.css">
</head>
<body class="entry-page" data-page="version-select">
  <main class="version-shell">
    <header class="version-topbar">
      <div>
        <p id="currentMode" class="entry-kicker">游客模式</p>
        <h1 class="version-title">选择版本</h1>
        <p class="version-copy">选择适合当前时间和难度的棋盘。</p>
      </div>
      <div class="version-top-actions">
        <a class="entry-link" href="index.html">返回入口</a>
        <a class="entry-link" href="stats.html">查看统计</a>
      </div>
    </header>

    <section class="version-grid" aria-label="数独版本">
      <article class="version-card" data-version="9x9" data-mark="九" role="button" tabindex="0">
        <div>
          <div class="version-index">01 / CLASSIC</div>
          <h2 class="version-card-title">9×9</h2>
          <p class="version-card-copy">经典九宫数独，包含完整难度、笔记、提示、暂停和存档操作。</p>
        </div>
        <div class="version-card-action">
          <span>进入经典数独</span>
          <span aria-hidden="true">→</span>
        </div>
      </article>

      <article class="version-card" data-version="4x4" data-mark="四" role="button" tabindex="0">
        <div>
          <div class="version-index">02 / QUICK</div>
          <h2 class="version-card-title">4×4</h2>
          <p class="version-card-copy">更短、更轻的四宫数独，适合快速练习或第一次体验。</p>
        </div>
        <div class="version-card-action">
          <span>进入轻量数独</span>
          <span aria-hidden="true">→</span>
        </div>
      </article>

      <article class="version-card" data-version="16x16" data-mark="十六" role="button" tabindex="0">
        <div>
          <div class="version-index">03 / LARGE</div>
          <h2 class="version-card-title">16×16</h2>
          <p class="version-card-copy">使用 1-9 与 A-G 的大棋盘版本，已补上网页版入口，更适合电脑或 iPad。</p>
        </div>
        <div class="version-card-action">
          <span>进入十六宫数独</span>
          <span aria-hidden="true">→</span>
        </div>
      </article>

      <article class="version-card" data-version="25x25" data-mark="二五" role="button" tabindex="0">
        <div>
          <div class="version-index">04 / XL</div>
          <h2 class="version-card-title">25×25</h2>
          <p class="version-card-copy">使用 A-Y 的超大棋盘版本，Web 端现已可游玩，建议优先使用大屏设备。</p>
        </div>
        <div class="version-card-action">
          <span>进入二十五宫数独</span>
          <span aria-hidden="true">→</span>
        </div>
      </article>
    </section>
  </main>

  <script src="web/scripts/entry-flow.js" data-page="version-select"></script>
  <script src="web/scripts/ink-experience.js"></script>
</body>
</html>
